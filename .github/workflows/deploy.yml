name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd ~/DolarArg
            git pull origin main
            npm install
            export PRISMA_SCHEMA_TARGET=postgresql
            if npm run build; then
              BUILD_STATUS=0
            else
              BUILD_STATUS=$?
            fi
            unset PRISMA_SCHEMA_TARGET
            node scripts/prepare-schema.js --sqlite
            if [ "$BUILD_STATUS" -ne 0 ]; then exit "$BUILD_STATUS"; fi
            pm2 restart dolar-app
